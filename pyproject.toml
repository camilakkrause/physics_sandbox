[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "physics-sandbox"
version = "0.2.0"
description = "A fast, extensible, pure-Newtonian classical mechanics sandbox powered by point masses and springs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
vis = [
    "polyscope>=2.0",
]
fast = [
    "numba>=0.58",
]
dev = [
    "pytest>=7.0",
]
all = [
    "polyscope>=2.0",
    "numba>=0.58",
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
include = ["physics_sandbox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
